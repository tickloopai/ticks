[package]
name = "tickloop-tick-tickloop"
description = "tick-tickloop: the official Tickloop Ticks, starting with the Reader for original financial documents"
version = "0.1.6"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tick-tickloop"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tickloop-tick-command.workspace = true
tickloop-tick-market.workspace = true
tickloop-tick-provider.workspace = true

[dev-dependencies]
libc = "0.2"
serde_json = "1"
tempfile = "3"
tickloop-tick-packages.workspace = true
