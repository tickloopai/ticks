[workspace]
members = ["market/*", "packages/*"]
resolver = "3"
exclude = ["vendor/*"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/tickloopai/ticks"

# Tick crates from the Tickloop repository, pinned to a commit on tickloopai/tickloop. Change the
# rev here and in [patch.crates-io] together; once Tickloop publishes a release tag that contains
# these crates, pin that tag instead. To build against a local checkout, see
# .cargo/config.toml.example.
[workspace.dependencies]
tickloop-tick-oauth = { git = "https://github.com/tickloopai/tickloop", rev = "4f9ac812f5d05fa05cbdc12c54f85c1b0a8a4148" }
tickloop-tick-oauth-test-server = { git = "https://github.com/tickloopai/tickloop", rev = "4f9ac812f5d05fa05cbdc12c54f85c1b0a8a4148" }
tickloop-tick-packages = { git = "https://github.com/tickloopai/tickloop", rev = "4f9ac812f5d05fa05cbdc12c54f85c1b0a8a4148" }
tickloop-tick-protocol = { git = "https://github.com/tickloopai/tickloop", rev = "4f9ac812f5d05fa05cbdc12c54f85c1b0a8a4148" }
tickloop-tick-sdk = { git = "https://github.com/tickloopai/tickloop", rev = "4f9ac812f5d05fa05cbdc12c54f85c1b0a8a4148" }
tickloop-ui = { git = "https://github.com/tickloopai/tickloop", rev = "4f9ac812f5d05fa05cbdc12c54f85c1b0a8a4148" }

# The financial Ticks and the provider interfaces they read, in market/.
tickloop-tick-command = { path = "market/command" }
tickloop-tick-market = { path = "market/views" }
tickloop-tick-provider = { path = "market/provider" }
tickloop-tick-test-support = { path = "market/test-support" }

[profile.dev]
debug = "line-tables-only"

[patch.crates-io]
# Tickloop's crossterm 0.29 with its Escape parsing fix, vendored at vendor/crossterm there.
crossterm = { git = "https://github.com/tickloopai/tickloop", rev = "4f9ac812f5d05fa05cbdc12c54f85c1b0a8a4148" }
# Reads no `.env` file for the Longbridge SDK; see vendor/dotenv/README.md.
dotenv = { path = "vendor/dotenv" }

[patch."https://github.com/longbridge/openapi"]
# Lets tick-longbridge renew tokens through the shared token file; see vendor/longbridge-oauth/README.md.
longbridge-oauth = { path = "vendor/longbridge-oauth" }
