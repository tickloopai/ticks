[workspace]
members = ["market/*", "packages/*"]
resolver = "3"
exclude = ["vendor/*"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/tickloopai/ticks"

# Tick crates from the Tickloop repository. The Tick protocol is still a draft, so these follow
# tickloopai/tickloop main (draft = latest); Cargo.lock records the exact commit every build uses.
# Move to the latest with `cargo update -p tickloop-tick-sdk` and commit Cargo.lock. Keep
# [patch.crates-io] on the same branch. To build against a local checkout, see
# .cargo/config.toml.example.
[workspace.dependencies]
tickloop-tick-oauth = { git = "https://github.com/tickloopai/tickloop", branch = "main" }
tickloop-tick-oauth-test-server = { git = "https://github.com/tickloopai/tickloop", branch = "main" }
tickloop-tick-packages = { git = "https://github.com/tickloopai/tickloop", branch = "main" }
tickloop-tick-protocol = { git = "https://github.com/tickloopai/tickloop", branch = "main" }
tickloop-tick-sdk = { git = "https://github.com/tickloopai/tickloop", branch = "main" }
tickloop-ui = { git = "https://github.com/tickloopai/tickloop", branch = "main" }

# The financial Ticks and the provider interfaces they read, in market/.
tickloop-tick-command = { path = "market/command" }
tickloop-tick-market = { path = "market/views" }
tickloop-tick-provider = { path = "market/provider" }
tickloop-tick-test-support = { path = "market/test-support" }

[profile.dev]
debug = "line-tables-only"

[patch.crates-io]
# Tickloop's crossterm 0.29 with its Escape parsing fix, vendored at vendor/crossterm there.
crossterm = { git = "https://github.com/tickloopai/tickloop", branch = "main" }
# Reads no `.env` file for the Longbridge SDK; see vendor/dotenv/README.md.
dotenv = { path = "vendor/dotenv" }

[patch."https://github.com/longbridge/openapi"]
# Lets tick-longbridge renew tokens through the shared token file; see vendor/longbridge-oauth/README.md.
longbridge-oauth = { path = "vendor/longbridge-oauth" }
