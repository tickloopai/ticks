name: Release
run-name: Release ${{ inputs.packages || 'every package' }}${{ inputs.version && format(' {0}', inputs.version) || '' }}

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to release, separated by spaces; leave empty for every package
        required: false
        default: ''
      version:
        description: X.Y.Z for every selected package; leave empty to bump each package's patch version
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ticks-release-prepare
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

# Runs `make release` from the default branch: bumps the versions, commits them, and pushes one
# <package>-vX.Y.Z tag per package. Tags pushed with the workflow's GITHUB_TOKEN start no
# workflow, so this job then starts "Release Tick packages" on each new tag itself.
jobs:
  release:
    name: Bump, tag and start the package releases
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - name: Require the default branch
        if: github.ref_name != github.event.repository.default_branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: |
          echo "::error::Run the release from $DEFAULT_BRANCH, not $SELECTED_BRANCH"
          exit 1

      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin
          rustup default stable

      - name: Restore the Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ticks-release-prepare-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ticks-release-prepare-${{ runner.os }}-${{ runner.arch }}-

      - name: Bump the versions, commit and push the tags
        env:
          TICK_PACKAGES: ${{ inputs.packages }}
          VERSION: ${{ inputs.version }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node scripts/release.mjs

      - name: Start the package releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(git tag --points-at HEAD)
          if [ -z "$tags" ]; then
            echo "::error::The release pushed no tags"
            exit 1
          fi
          for tag in $tags; do
            gh workflow run release-ticks.yml --ref "$tag"
            echo "Started Release Tick packages on $tag" >> "$GITHUB_STEP_SUMMARY"
          done
