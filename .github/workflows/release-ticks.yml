name: Release Tick packages
run-name: Release Tick packages ${{ github.ref_name }}

on:
  push:
    tags:
      - '*-v*'
  # Started on a tag by the Release workflow, whose GITHUB_TOKEN tag pushes start no workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticks-release
  queue: max

env:
  CARGO_TERM_COLOR: never
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_COMMIT: ${{ github.sha }}

# Each stage is its own job, and each target its own build, so a failed one can be re-run alone ("Re-run failed jobs")
# without repeating the stages that already passed. A repeated publish keeps the releases an
# earlier attempt created, as long as they carry the same archives. Releases reuse the pushed
# <package>-vX.Y.Z tag; the marketplace update is a commit to the default branch.
# The build fetches the Tickloop crates from tickloopai/tickloop, which must be public.
jobs:
  check:
    name: Check the tag and release scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Test release scripts
        run: node --test scripts/release.test.mjs scripts/release-ticks.test.mjs

      - name: Validate release tag
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$RELEASE_REF_TYPE" != tag ]; then
            echo "::error::Run this workflow on a <package>-vX.Y.Z tag, not the branch $RELEASE_TAG"
            exit 1
          fi
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eqx '[a-z][a-z0-9-]*-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'; then
            echo "::error::Expected a <package>-vX.Y.Z release tag, not $RELEASE_TAG"
            exit 1
          fi

  # One archive per target, each built and run on a machine of its own architecture: Linux on
  # native runners (static musl, as the Linux Tickloop is), Intel macOS under Rosetta. Publishing
  # waits for all four, so a version never ships for only some targets.
  build:
    name: Build and verify ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            tickloop: aarch64-apple-darwin
          - target: x86_64-apple-darwin
            runner: macos-15
            tickloop: aarch64-apple-darwin
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            tickloop: aarch64-unknown-linux-musl
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            tickloop: x86_64-unknown-linux-musl
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rosetta
        if: matrix.target == 'x86_64-apple-darwin'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$RELEASE_TARGET"
          rustup default stable

      - name: Restore the Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ticks-release-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ticks-release-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-

      # The build installs each archive with the latest released Tickloop, as users install it.
      - name: Download the released Tickloop
        env:
          TICKLOOP_TARGET: ${{ matrix.tickloop }}
        run: |
          directory=$RUNNER_TEMP/tickloop
          archive=tickloop-$TICKLOOP_TARGET.tar.gz
          mkdir -p "$directory"
          cd "$directory"
          for name in "$archive" "$archive.sha256"; do
            curl -fsSL --retry 3 -o "$name" "https://github.com/tickloopai/homebrew-tap/releases/latest/download/$name"
          done
          shasum -a 256 -c "$archive.sha256"
          tar -xzf "$archive" tickloop
          echo "TICKLOOP=$directory/tickloop" >> "$GITHUB_ENV"
          ./tickloop --version

      - name: Build and check the packages
        run: scripts/release-ticks.sh build

      - name: Keep the archives for publishing and verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tick-packages-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/release
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the releases and update the marketplace
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    environment:
      name: tick-marketplace
      url: https://github.com/tickloopai/ticks
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out the default branch for the marketplace update
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: marketplace

      - name: Restore the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tick-packages-${{ github.ref_name }}-*
          merge-multiple: true
          path: dist/release

      - name: Create the releases and update the marketplace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '### Tick packages %s\n\nCommit: %s\n\n' "$RELEASE_TAG" "$RELEASE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          scripts/release-ticks.sh publish marketplace dist/release

  verify:
    name: Verify downloads
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Restore the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tick-packages-${{ github.ref_name }}-*
          merge-multiple: true
          path: dist/release

      - name: Download every release asset anonymously
        run: scripts/release-ticks.sh verify dist/release
